<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Achados e Perdidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* RESET */
        *{ margin:0; padding:0; box-sizing:border-box; }

        body{
            min-height:100vh;
            background-color:#FFF5F8;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Georgia, serif;
            padding:20px;
        }

        .card{
            background:#FFFFFF;
            width:100%;
            max-width:400px;
            padding:50px 40px;
            border-radius:24px;
            border:1px solid #F8BBD0;
            box-shadow:0 8px 35px rgba(236,111,152,0.15);
            text-align:center;
        }

        .titulo{
            font-size:48px;
            color:#EC6F98;
            margin-bottom:30px;
        }

        .input-group{ margin-bottom:18px; }

        .input-group input{
            width:100%;
            height:52px;
            border-radius:14px;
            border:1px solid #F8BBD0;
            padding:0 15px;
            font-size:16px;
            background:#FFFFFF;
            color:#5A5A5A;
            outline:none;
            transition:0.3s;
        }

        .input-group input:focus{
            border-color:#EC6F98;
            box-shadow:0 0 8px rgba(236,111,152,0.2);
        }

        .login-btn{
            width:100%;
            height:50px;
            border:none;
            border-radius:20px;
            background:#F48FB1;
            color:#333;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
            margin-top:8px;
        }

        .login-btn:hover{
            background:#EC6F98;
            color:white;
            transform:scale(1.02);
        }

        .google-btn{
            width:100%;
            height:50px;
            border-radius:20px;
            border:1px solid #F8BBD0;
            background:#FFFFFF;
            color:#EC6F98;
            cursor:pointer;
            margin-top:12px;
            font-size:16px;
            transition:0.3s;
        }

        .google-btn:hover{ background:#FCE4EC; }

        .link{
            margin-top:18px;
            font-size:14px;
            color:#7A7A7A;
        }

        .link a{
            color:#EC6F98;
            text-decoration:none;
            font-weight:bold;
        }

        @media(max-width:600px){
            .card{ padding:40px 25px; }
            .titulo{ font-size:40px; }
        }
    </style>
</head>

<body>

<div class="card">
    <p class="titulo">Login</p>

    <form id="formLogin">
        <div class="input-group">
            <input type="email" name="email" placeholder="Email" required>
        </div>
        <div class="input-group">
            <input type="password" name="senha" placeholder="Senha" required>
        </div>
        <button type="submit" class="login-btn">Entrar</button>
    </form>

    <button id="googleLogin" class="google-btn">Entrar com Google</button>

    <p class="link">
        Não tem conta? <a href="cadastro.html">Cadastrar</a>
    </p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        GoogleAuthProvider, 
        signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Sua configuração do Firebase
    const firebaseConfig = {
    apiKey: "AIzaSyA7_IQGEBh6Zr3apBR4ujviyOyqcfAJPaw",
    authDomain: "achados-e-perdidos-bae54.firebaseapp.com",
    projectId: "achados-e-perdidos-bae54",
    storageBucket: "achados-e-perdidos-bae54.appspot.com",
    messagingSenderId: "744697102397",
    appId: "1:744697102397:web:badc010a0331aa54af2a54"
};

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Lógica de Login com Email
    const form = document.getElementById("formLogin");
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = form.email.value;
        const senha = form.senha.value;

        try {
            await signInWithEmailAndPassword(auth, email, senha);
            alert("Login realizado com sucesso!");
            window.location.href = "telainicial.html";
        } catch(err) {
            console.error(err);
            alert("Erro no login: " + err.message);
        }
    });

    // Lógica de Login com Google
    const btnGoogle = document.getElementById("googleLogin");
    btnGoogle.addEventListener("click", async () => {
        try {
            // Abre o popup do Google
            const resultado = await signInWithPopup(auth, provider);
            
            // Se chegou aqui, logou!
            console.log("Usuário logado:", resultado.user);
            alert("Bem-vindo(a), " + resultado.user.displayName);
            
            window.location.href = "telainicial.html";
        } catch(err) {
            console.error("Erro detalhado do Google:", err);
            
            // Tratamento de erro específico para domínio não autorizado
            if (err.code === "auth/unauthorized-domain") {
                alert("Erro: Este domínio não está autorizado no Firebase console.");
            } else {
                alert("Erro ao logar com Google: " + err.message);
            }
        }
    });
</script>

</body>
</html>
