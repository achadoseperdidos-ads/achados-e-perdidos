<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Achados e Perdidos</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(180deg, #FFF0F5 0%, #FCE4EC 100%);
    min-height:100vh;
    overflow-x:hidden;
}

/* TOPO FIXO */
.topo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;

    background:#F8BBD0;
    border-bottom:1px solid #F3A6C1;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;
    box-sizing:border-box;

    z-index:10;
}

.logo{
    font-weight:bold;
    color:#EC6F98;
    font-size:16px;
}

.usuario{
    font-size:14px;
    color:#5A5A5A;

    flex:1;
    min-width:0;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.usuario-area{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
}

.logout{
    background:#FFFFFF;
    color:#EC6F98;
    border:1.5px solid #EC6F98;

    padding:6px 10px;
    border-radius:18px;
    font-size:12px;

    cursor:pointer;

    flex-shrink:0;
    white-space:nowrap;
}

.logout:hover{
    background:#EC6F98;
    color:white;
}

/* CENTRALIZA TUDO */
.container{
    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:80px 20px 20px;
}

h1{
    font-size:34px;
    color:#EC6F98;
    margin-bottom:5px;
}

p{
    color:#7A7A7A;
    margin-bottom:30px;
}

/* CARDS */
.cards{
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    gap:20px;
}

.card{
    width:260px;
    max-width:90%;

    margin:0 auto;

    background:white;
    padding:25px;
    border-radius:12px;

    box-shadow:0 2px 10px rgba(236,111,152,0.15);

    display:flex;
    flex-direction:column;
    gap:10px;

    cursor:pointer;
    transition:0.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 18px rgba(236,111,152,0.25);
}

.card h3{
    color:#EC6F98;
}

.card p{
    font-size:14px;
    color:#666;
    margin:0;
}

</style>
</head>

<body>

<div class="topo">

    <div class="logo">
        Achados & Perdidos
    </div>

    <div class="usuario-area">
        <div class="usuario" id="nomeUsuario">
            Você não está logado
        </div>

        <button class="logout" onclick="sair()">
            Sair
        </button>
    </div>

</div>

<div class="container">

    <h1>Bem-vindo</h1>
    <p>Sistema de Achados e Perdidos da Escola</p>

    <div class="cards">

        <div class="card" onclick="irEncontrar()">
            <h3>Encontrei um item</h3>
            <p>Registrar objeto encontrado</p>
        </div>

        <div class="card" onclick="irPerdeu()">
            <h3>Perdi um item</h3>
            <p>Registrar objeto perdido</p>
        </div>

    </div>

</div>

<script>
let usuarioLogado = false;

function irEncontrar(){
    window.location.href = "encontroualgo.html";
}

function irPerdeu(){
    window.location.href = "achadoseperdidos.html";
}

function sair(){
    alert("Você saiu da conta!");
    location.reload();
}
</script>

</body>
</html>
