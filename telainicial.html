<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Achados e Perdidos</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(180deg, #FFF0F5 0%, #FCE4EC 100%);
    min-height:100vh;
    overflow-x:hidden;
}

/* TOPO FIXO */
.topo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;

    background:#F8BBD0;
    border-bottom:1px solid #F3A6C1;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;
    box-sizing:border-box;

    z-index:10;
}

.logo{
    font-weight:bold;
    color:#EC6F98;
    font-size:16px;
}

.usuario{
    font-size:14px;
    color:#5A5A5A;

    flex:1;
    min-width:0;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.usuario-area{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
}

.logout{
    background:#FFFFFF;
    color:#EC6F98;
    border:1.5px solid #EC6F98;

    padding:6px 10px;
    border-radius:18px;
    font-size:12px;

    cursor:pointer;

    flex-shrink:0;
    white-space:nowrap;
}

.logout:hover{
    background:#EC6F98;
    color:white;
}

/* CONTAINER */
.container{
    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:flex-start;

    align-items:center;
    text-align:center;

    padding:170px 20px 20px;
}

h1{
    font-size:34px;
    color:#EC6F98;
    margin-bottom:5px;
}

p{
    color:#7A7A7A;
    margin-bottom:30px;
}

/* CARDS */
.cards{
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:20px;
}

.card{
    width:260px;

    background:white;
    padding:25px;
    border-radius:12px;

    box-shadow:0 2px 10px rgba(236,111,152,0.15);

    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;

    cursor:pointer;
    transition:0.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 18px rgba(236,111,152,0.25);
}

.card h3{
    color:#EC6F98;
    font-size:18px;
}

.card p{
    font-size:14px;
    color:#666;
    margin:0;
}

/* RESPONSIVO */
@media (max-width: 600px){

    .cards{
        flex-direction:column;
        align-items:center;
        gap:15px;
    }

    .card{
        width:90%;
        max-width:320px;
        padding:20px;
    }

    .card h3{
        font-size:16px;
    }

    .card p{
        font-size:13px;
    }

    .topo{
        flex-direction:column;
        height:auto;
        padding:10px;
        gap:8px;
    }

    .container{
        padding:100px 15px 20px;
    }
}

</style>
</head>

<body>

<div class="topo">

    <div class="logo">
        Achados & Perdidos
    </div>

    <div class="usuario-area">
        <div class="usuario" id="nomeUsuario">
            Você não está logado
        </div>

        <button class="logout" onclick="sair()">
            Sair
        </button>
    </div>

</div>

<div class="container">

    <h1>Bem-vindo</h1>
    <p>Sistema de Achados e Perdidos da Escola</p>

    <div class="cards">

        <div class="card" onclick="irEncontrar()">
            <h3>Encontrei um item</h3>
            <p>Registrar objeto encontrado</p>
        </div>

        <div class="card" onclick="irPerdeu()">
            <h3>Perdi um item</h3>
            <p>Registrar objeto perdido</p>
        </div>

    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_AUTH_DOMAIN",
        projectId: "SEU_PROJECT_ID",
        storageBucket: "SEU_BUCKET",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let usuarioLogado = false;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            usuarioLogado = true;
            document.getElementById("nomeUsuario").innerText =
                "Olá, " + (user.displayName || user.email);
        } else {
            usuarioLogado = false;
            document.getElementById("nomeUsuario").innerText =
                "Você não está logado";
        }
    });

    window.irEncontrar = function() {
        if (!usuarioLogado) {
            alert("Faça login ou cadastre-se!");
            window.location.href = "login.html";
        } else {
            window.location.href = "encontroualgo.html";
        }
    }

    window.irPerdeu = function() {
        if (!usuarioLogado) {
            alert("Faça login ou cadastre-se!");
            window.location.href = "login.html";
        } else {
            window.location.href = "achadoseperdidos.html";
        }
    }

    window.sair = async function() {
        try {
            await signOut(auth);
            alert("Você saiu da conta!");
            location.reload();
        } catch (error) {
            alert("Erro ao sair: " + error.message);
        }
    }
</script>

</body>
</html>
