<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro – Achados e Perdidos</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height: 100vh;
    background: #f9f7f4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    padding: 52px 44px 48px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    text-align: center;
  }

  .titulo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6rem;
  }

  .subtitulo {
    font-family:'Bebas Neue';
    font-size:0.95rem;
    letter-spacing:5px;
    color:#bbb;
    margin-bottom:22px;
  }

  .input-group {
    display:flex;
    align-items:center;
    background:#8b2e2e;
    border-radius:50px;
    padding:0 20px;
    margin-bottom:14px;
    height:52px;
  }

  .input-group input {
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:#fff;
  }

  .btn-entrar {
    margin-top:8px;
    background:#8b2e2e;
    color:#fff;
    border:none;
    border-radius:50px;
    width:100%;
    height:48px;
    cursor:pointer;
  }

  .google-btn {
    margin-top:10px;
    background:#4285F4;
    color:white;
    border:none;
    border-radius:50px;
    width:100%;
    height:48px;
    cursor:pointer;
  }

  .erro-msg {
    background:#fde8e8;
    color:#8b2e2e;
    border-radius:10px;
    padding:10px;
    display:none;
    margin-bottom:10px;
  }

  .login-link {
    margin-top:15px;
    font-size:14px;
  }
</style>
</head>

<body>
<div class="card">

  <p class="titulo">Achados e Perdidos</p>
  <p class="subtitulo">ETEC ASSIS</p>

  <div class="erro-msg" id="erroMsg"></div>

  <form id="formCad">
    <div class="input-group">
      <input type="text" name="nome" placeholder="Nome" required>
    </div>

    <div class="input-group">
      <input type="email" name="email" placeholder="Email" required>
    </div>

    <div class="input-group">
      <input type="password" name="senha" placeholder="Senha" required>
    </div>

    <button type="submit" class="btn-entrar">Cadastrar</button>
  </form>

  <!-- 🔥 GOOGLE -->
  <button id="googleLogin" class="google-btn">
    Continuar com Google
  </button>

  <!-- 🔥 LOGIN -->
  <p class="login-link">
    Já tem conta? <a href="login.html">Faça login</a>
  </p>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA7_IQGEBh6Zr3apBR4ujviyOyqcfAJPaw",
  authDomain: "achados-e-perdidos-bae54.firebaseapp.com",
  projectId: "achados-e-perdidos-bae54",
  storageBucket: "achados-e-perdidos-bae54.appspot.com",
  messagingSenderId: "744697102397",
  appId: "1:744697102397:web:badc010a0331aa54af2a54"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔥 CADASTRO
const form = document.getElementById("formCad");

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  const nome = form.nome.value;
  const email = form.email.value;
  const senha = form.senha.value;

  try {
    await createUserWithEmailAndPassword(auth, email, senha);

    alert("Conta criada com sucesso! Bem-vinda, " + nome);

    setTimeout(()=>{
      window.location.href = "telainicial.html";
    }, 1000);

  } catch(err){
    const el = document.getElementById("erroMsg");
    el.style.display = "block";
    el.textContent = err.message;
  }
});

// 🔥 GOOGLE LOGIN
const googleBtn = document.getElementById("googleLogin");

googleBtn.addEventListener("click", async ()=>{
  const provider = new GoogleAuthProvider();

  try{
    const result = await signInWithPopup(auth, provider);

    alert("Bem-vinda, " + result.user.displayName);

    setTimeout(()=>{
      window.location.href = "telainicial.html";
    }, 1000);

  }catch(err){
    alert("Erro no Google: " + err.message);
  }
});
</script>

</body>
</html>
