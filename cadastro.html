<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro – Achados e Perdidos</title>
<link href="https://fonts.googleapis.com/css2?family=Georgia&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { min-height:100vh; background-color:#FFF5F8; display:flex; align-items:center; justify-content:center; font-family:Georgia, serif; padding:20px; }
.card { background:#FFFFFF; border-radius:24px; padding:50px 40px; width:100%; max-width:400px; box-shadow:0 8px 35px rgba(236,111,152,0.15); text-align:center; border:1px solid #F8BBD0; }
.titulo { font-size:48px; color:#EC6F98; margin-bottom:5px; }
.subtitulo { font-size:18px; color:#7A7A7A; margin-bottom:30px; }
.input-group { margin-bottom:18px; }
.input-group input { width:100%; height:52px; border-radius:14px; border:1px solid #F8BBD0; padding:0 15px; font-size:16px; background:#FFFFFF; color:#5A5A5A; outline:none; transition:0.3s; }
.input-group input:focus { border-color:#EC6F98; box-shadow:0 0 8px rgba(236,111,152,0.2); }
.input-group input::placeholder { color:#B0B0B0; }
.btn-entrar { margin-top:10px; background:#F48FB1; color:#333; border:none; border-radius:20px; width:100%; height:50px; cursor:pointer; font-size:18px; transition:0.3s; }
.btn-entrar:hover { background:#EC6F98; color:white; transform:scale(1.02); }
.google-btn { margin-top:12px; background:#FFFFFF; border:1px solid #F8BBD0; color:#EC6F98; border-radius:20px; width:100%; height:50px; cursor:pointer; font-size:16px; transition:0.3s; }
.google-btn:hover { background:#FCE4EC; }
.erro-msg { background:#FCE4EC; color:#EC6F98; border-radius:12px; padding:10px; display:none; margin-bottom:15px; font-size:14px; }
.login-link { margin-top:18px; font-size:14px; color:#7A7A7A; }
.login-link a { color:#EC6F98; text-decoration:none; font-weight:bold; }
.login-link a:hover { text-decoration:underline; }
@media (max-width:600px){ .card{ padding:40px 25px; } .titulo{ font-size:38px; } }
</style>
</head>
<body>
<div class="card">
  <p class="titulo">Achados e Perdidos</p>
  <p class="subtitulo">ETEC ASSIS</p>
  <div class="erro-msg" id="erroMsg"></div>
  <form id="formCad">
    <div class="input-group"><input type="text" name="nome" placeholder="Nome" required></div>
    <div class="input-group"><input type="email" name="email" placeholder="Email" required></div>
    <div class="input-group"><input type="password" name="senha" placeholder="Senha" required></div>
    <button type="submit" class="btn-entrar">Cadastrar</button>
  </form>
  <button id="googleLogin" class="google-btn">Continuar com Google</button>
  <p class="login-link">Já tem conta? <a href="login.html">Faça login</a></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA7_IQGEBh6Zr3apBR4ujviyOyqcfAJPaw",
  authDomain: "achados-e-perdidos-bae54.firebaseapp.com",
  projectId: "achados-e-perdidos-bae54",
  storageBucket: "achados-e-perdidos-bae54.appspot.com",
  messagingSenderId: "744697102397",
  appId: "1:744697102397:web:badc010a0331aa54af2a54"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const isIphone = /iPhone/i.test(navigator.userAgent);

/* CAPTURA RETORNO DO REDIRECT (só no iPhone) */
if (isIphone) {
    getRedirectResult(auth).then((result) => {
        if (result && result.user) {
            alert("Bem-vinda, " + result.user.displayName);
            setTimeout(() => { window.location.href = "telainicial.html"; }, 1000);
        }
    }).catch((err) => {
        alert("Erro no Google: " + err.message);
    });
}

/* FORM CADASTRO */
document.getElementById("formCad").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nome = e.target.nome.value;
  const email = e.target.email.value;
  const senha = e.target.senha.value;
  try {
    await createUserWithEmailAndPassword(auth, email, senha);
    alert("Conta criada com sucesso! Bem-vinda, " + nome);
    setTimeout(() => { window.location.href = "telainicial.html"; }, 1000);
  } catch(err) {
    const el = document.getElementById("erroMsg");
    el.style.display = "block";
    el.textContent = err.message;
  }
});

/* GOOGLE LOGIN */
document.getElementById("googleLogin").addEventListener("click", async () => {
  const provider = new GoogleAuthProvider();
  try {
    if (isIphone) {
      await signInWithRedirect(auth, provider);
    } else {
      const result = await signInWithPopup(auth, provider);
      alert("Bem-vinda, " + result.user.displayName);
      setTimeout(() => { window.location.href = "telainicial.html"; }, 1000);
    }
  } catch(err) {
    alert("Erro no Google: " + err.message);
  }
});
</script>
</body>
</html>
