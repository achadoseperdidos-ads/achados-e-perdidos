<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<!-- Responsividade -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Achados e Perdidos – Perdi um Item</title>

<style>
/* BASE */
body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #FFF5F8;
    text-align: center;
}

/* TOPO */
.topo {
    background-color:#F8BBD0;
    color: #5A5A5A;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* usuário */
.usuario {
    font-size: 14px;
}

/* sair */
.logout {
    background: white;
    color: #EC6F98;
    border: none;
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
}

/* TÍTULO */
h1 {
    font-size: 48px;
    margin-top: 30px;
    color: #EC6F98;
}

/* SUBTÍTULO */
p {
    margin-top: -15px;
    font-size: 18px;
    color: #7A7A7A;
}

/* FORM */
form {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    gap: 80px;
}

/* colunas */
.coluna {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* inputs */
input, textarea {
    width: 250px;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #F8BBD0;
    background-color: #FFFFFF;
    color: #5A5A5A;
    font-size: 16px;
}

/* textarea */
textarea {
    height: 70px;
    resize: none;
}

/* placeholder */
input::placeholder,
textarea::placeholder {
    color: #B0B0B0;
}

/* botões */
.botoes {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

button {
    padding: 10px 30px;
    border-radius: 20px;
    border: none;
    background-color: #F48FB1;
    color: #333;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #EC6F98;
    color: white;
    transform: scale(1.03);
}

/* RESPONSIVO */
@media (max-width: 600px) {
    form {
        flex-direction: column;
        gap: 20px;
        margin: 20px;
    }

    input, textarea {
        width: 100%;
    }

    .botoes {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<!-- TOPO -->
<div class="topo">
    <div class="usuario" id="nomeUsuario">Você não está logado</div>
    <button class="logout" onclick="sair()">Sair</button>
</div>

<!-- TÍTULO -->
<h1>Achados e Perdidos</h1>
<p>Perdeu algo? Conte pra gente!</p>

<!-- FORMULÁRIO -->
<form id="formPerdido">

    <div class="coluna">
        <input type="text" name="item" placeholder="Nome do item">
        <input type="text" name="local" placeholder="Local que foi perdido">
        <textarea name="descricao" placeholder="Descrição do item"></textarea>
    </div>

    <div class="coluna">
        <input type="text" name="data" placeholder="Data" required>
        <input type="text" name="contato" placeholder="Contato">

        <div class="botoes">
            <button type="button" onclick="history.back()">← Voltar</button>
            <button type="submit">Enviar</button>
        </div>
    </div>

</form>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, collection, addDoc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import { 
  getAuth, onAuthStateChanged, signOut 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyA7_IQGEBh6Zr3apBR4ujviyOyqcfAJPaw",
  authDomain: "achados-e-perdidos-bae54.firebaseapp.com",
  projectId: "achados-e-perdidos-bae54",
  storageBucket: "achados-e-perdidos-bae54.appspot.com",
  messagingSenderId: "744697102397",
  appId: "1:744697102397:web:badc010a0331aa54af2a54"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* LOGIN NO TOPO */
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("nomeUsuario").innerText =
      "Olá, " + (user.displayName || user.email);
  } else {
    document.getElementById("nomeUsuario").innerText =
      "Você não está logado";
  }
});

/* SAIR */
window.sair = function () {
  signOut(auth).then(() => {
    alert("Você saiu da conta!");
    location.reload();
  });
};

/* FORM SUBMIT */
const form = document.getElementById("formPerdido");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const item = form.item.value;
  const local = form.local.value;
  const descricao = form.descricao.value;
  const data = form.data.value;
  const contato = form.contato.value;

  try {
    await addDoc(collection(db, "itens_perdidos"), {
      item, local, descricao, data, contato
    });

    alert("Item perdido registrado!");
    form.reset();

  } catch (erro) {
    alert("Erro ao enviar!");
  }
});

</script>

</body>
</html>
