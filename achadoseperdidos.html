<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achados e Perdidos – Perdi um Item</title>

    <style>
        /* RESETt */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Georgia, serif;
            background-color: #FFF5F8;
            text-align: center;
        }

        /* TOPO */
        .topo {
            background-color:#F8BBD0;
            color: #5A5A5A;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 100;
        }

        .usuario { font-size: 14px; }

        .logout {
            background: white;
            color: #EC6F98;
            border: 1.5px solid #EC6F98;
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            z-index: 101;
        }

        h1 { font-size: 48px; margin-top: 30px; color: #EC6F98; }
        p { margin-top: -15px; font-size: 18px; color: #7A7A7A; }

        /* FORMULÁRIO */
        form {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 80px;
            position: relative;
            z-index: 1;
        }

        .coluna { display: flex; flex-direction: column; gap: 20px; }

        input, textarea {
            width: 100%;
            max-width: 250px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #F8BBD0;
            background-color: #FFFFFF;
            font-size: 16px;
            font-family: Georgia, serif;
        }

        /* AJUSTE PARA O CAMPO DE DATA  */
        input[type="date"] {
            color: #7A7A7A;
        }

        /* ÁREA DOS BOTÕES */
        .botoes {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            position: relative; 
            z-index: 999; 
        }

        button {
            padding: 12px 25px;
            border-radius: 20px;
            border: none;
            background-color: #F48FB1;
            color: #333;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            pointer-events: auto !important; 
        }

        button:hover {
            background-color: #EC6F98;
            color: white;
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            form { flex-direction: column; align-items: center; gap: 20px; }
            .botoes { flex-direction: row; }
        }
    </style>
</head>

<body>

<div class="topo">
    <div class="usuario" id="nomeUsuario">Carregando usuário...</div>
    <button class="logout" onclick="sair()">Sair</button>
</div>

<h1>Achados e Perdidos</h1>
<p>Perdeu algo? Conte pra gente!</p>

<form id="formPerdido">
    <div class="coluna">
        <input type="text" name="item" placeholder="Nome do item" required>
        <input type="text" name="local" placeholder="Local que foi perdido" required>
        <textarea name="descricao" placeholder="Descrição do item"></textarea>
    </div>

    <div class="coluna">
        <input type="date" name="data" required>
        
        <input type="text" name="contato" placeholder="Seu contato" required>

        <div class="botoes">
            <button type="button" onclick="window.history.back();">Voltar</button>
            <button type="submit">Enviar Item</button>
        </div>
    </div>
</form>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA7_IQGEBh6Zr3apBR4ujviyOyqcfAJPaw",
        authDomain: "achados-e-perdidos-bae54.firebaseapp.com",
        projectId: "achados-e-perdidos-bae54",
        storageBucket: "achados-e-perdidos-bae54.firebasestorage.app",
        messagingSenderId: "744697102397",
        appId: "1:744697102397:web:badc010a0331aa54af2a54"
    };

    let db, auth;
    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        console.log("🔥 Firebase conectado!");
    } catch (e) {
        console.error("❌ Erro ao conectar:", e);
    }

    onAuthStateChanged(auth, (user) => {
        const userDiv = document.getElementById("nomeUsuario");
        if (userDiv) {
            userDiv.innerText = user ? "Olá, " + (user.displayName || user.email) : "Não logado";
        }
    });

    window.sair = () => {
        signOut(auth).then(() => {
            alert("Até logo!");
            window.location.reload(); 
        });
    };

    const form = document.getElementById("formPerdido");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        try {
            const payload = {
                item: form.querySelector('input[name="item"]').value,
                local: form.querySelector('input[name="local"]').value,
                descricao: form.querySelector('textarea[name="descricao"]').value || "",
                data: form.querySelector('input[name="data"]').value,
                contato: form.querySelector('input[name="contato"]').value,
                status: "aberto",
                        criadoEm: serverTimestamp()
            };

            if (!db) throw new Error("Banco de dados offline.");

            await addDoc(collection(db, "itens_perdidos"), payload);
            
            alert("Item cadastrado com sucesso!\nEntraremos em contato pelos dados informados assim que o objeto for localizado.");
            
            form.reset();

        } catch (error) {
            console.error("❌ Erro:", error);
            alert("Houve um erro ao enviar: " + error.message);
        }
    
    });
</script>

</body>
</html>
