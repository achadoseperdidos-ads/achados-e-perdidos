<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Achados e Perdidos – Perdi um Item</title>

<style>

/* RESET */
* {
    box-sizing: border-box;
}

/* BASE */
body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #FFF5F8;
    text-align: center;
}

/* TOPO */
.topo {
    background-color:#F8BBD0;
    color: #5A5A5A;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* usuário */
.usuario {
    font-size: 14px;
}

/* BOTÃO SAIR */
.logout {
    background: white;
    color: #EC6F98;
    border: 1.5px solid #EC6F98;
    padding: 6px 14px;
    border-radius: 18px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    margin-right: 5px;
}

.logout:hover {
    background: #EC6F98;
    color: white;
}

/* TÍTULO */
h1 {
    font-size: 48px;
    margin-top: 30px;
    color: #EC6F98;
}

/* SUBTÍTULO */
p {
    margin-top: -15px;
    font-size: 18px;
    color: #7A7A7A;
}

/* FORM */
form {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    gap: 80px;
}

/* colunas */
.coluna {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* inputs */
input, textarea {
    width: 100%;
    max-width: 250px;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #F8BBD0;
    background-color: #FFFFFF;
    color: #5A5A5A;
    font-size: 16px;
}

/* textarea */
textarea {
    height: 70px;
    resize: none;
}

/* botões */
.botoes {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    width: 100%;
    justify-content: center;
}

/* botão padrão */
button {
    padding: 10px 20px;
    border-radius: 20px;
    border: none;
    background-color: #F48FB1;
    color: #333;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #EC6F98;
    color: white;
    transform: scale(1.03);
}

/* 📱 RESPONSIVO */
@media (max-width: 600px) {

    form {
        flex-direction: column;
        gap: 15px;
        margin: 15px;
        align-items: center;
    }

    .coluna {
        width: 100%;
        align-items: center;
    }

    input, textarea {
        max-width: 100%;
    }

    /* BOTÕES LADO A LADO */
    .botoes {
        flex-direction: row;
        justify-content: center;
        gap: 10px;
    }

    .botoes button {
        flex: 1;
        max-width: 150px;
    }
}

</style>
</head>

<body>

<div class="topo">
    <div class="usuario" id="nomeUsuario">Você não está logado</div>
    <button class="logout" onclick="sair()">Sair</button>
</div>

<h1>Achados e Perdidos</h1>
<p>Perdeu algo? Conte pra gente!</p>

<form id="formPerdido">

    <div class="coluna">
        <input type="text" name="item" placeholder="Nome do item">
        <input type="text" name="local" placeholder="Local que foi perdido">
        <textarea name="descricao" placeholder="Descrição do item"></textarea>
    </div>

    <div class="coluna">
        <input type="text" name="data" placeholder="Data" required>
        <input type="text" name="contato" placeholder="Contato">

        <div class="botoes">
            <button type="button" onclick="history.back()">Voltar</button>
            <button type="submit">Enviar</button>
        </div>
    </div>

</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "SEU_DOMINIO",
  projectId: "SEU_ID",
  storageBucket: "SEU_BUCKET",
  messagingSenderId: "SEU_ID",
  appId: "SEU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  document.getElementById("nomeUsuario").innerText =
    user ? "Olá, " + (user.displayName || user.email) : "Você não está logado";
});

window.sair = function () {
  signOut(auth).then(() => {
    alert("Você saiu da conta!");
    location.reload();
  });
};

const form = document.getElementById("formPerdido");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const { item, local, descricao, data, contato } = form;

  try {
    await addDoc(collection(db, "itens_perdidos"), {
      item: item.value,
      local: local.value,
      descricao: descricao.value,
      data: data.value,
      contato: contato.value
    });

    alert("Item perdido registrado!");
    form.reset();

  } catch {
    alert("Erro ao enviar!");
  }
});
</script>

</body>
</html>
